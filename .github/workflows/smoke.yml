name: Smoke Tests
run-name: "🔥 Smoke Tests · ${{ github.event_name }} on ${{ github.head_ref || github.ref_name }} by ${{ github.actor }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push cancels the older run still in progress
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: 🔥 Smoke Suite (Chromium)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: ℹ️ Show run info
        run: |
          echo "Suite:     Smoke (@SMOKE)"
          echo "Trigger:   ${{ github.event_name }} by ${{ github.actor }}"
          echo "Branch:    ${{ github.head_ref || github.ref_name }}"
          echo "Commit:    ${{ github.sha }}"
          echo "Node:      $(node -v)  |  npm: $(npm -v)"
          echo "Tests to run:"
          npx playwright test --project=smoke --list
      - name: 🌐 Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: 🧪 Run smoke tests
        run: npm run test:smoke
      - name: 📊 Write test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs "Smoke" >> "$GITHUB_STEP_SUMMARY"
      - name: 📤 Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7
