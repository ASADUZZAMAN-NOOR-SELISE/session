name: Regression Tests
run-name: "🌙 Regression Tests · ${{ github.event_name }} on ${{ github.ref_name }} by ${{ github.actor }}"

on:
  schedule:
    # 20:00 UTC = 2:00 AM Bangladesh time (UTC+6)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  regression:
    name: 🌙 Regression Suite (Chromium)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: ℹ️ Show run info
        run: |
          echo "Suite:     Regression (@REGRESSION)"
          echo "Trigger:   ${{ github.event_name }} by ${{ github.actor }}"
          echo "Branch:    ${{ github.ref_name }}"
          echo "Commit:    ${{ github.sha }}"
          echo "Node:      $(node -v)  |  npm: $(npm -v)"
          echo "Tests to run:"
          npx playwright test --project=regression --list
      - name: 🌐 Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: 🧪 Run regression tests
        run: npm run test:regression
      - name: 📊 Write test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs "Regression" >> "$GITHUB_STEP_SUMMARY"
      - name: 📤 Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: regression-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
